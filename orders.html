<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Track your food deliveries in real-time and view order history on FoodHub." />
  <title>Your Orders — FoodHub</title>
  <style>
    body { opacity: 0; transition: opacity 0.2s ease-in; background: var(--gray-100); }
    .fh-order-header {
      background: linear-gradient(135deg, var(--dark-light), var(--dark));
      padding: 3rem 0;
      color: white;
      margin-bottom: 2rem;
      border-radius: 0 0 2rem 2rem;
      box-shadow: var(--shadow-md);
    }
    .fh-live-map-container {
      height: 200px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: relative;
      background: var(--gray-200);
      margin-bottom: 1.5rem;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
    }
    .fh-live-map-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.8;
      filter: contrast(1.1) brightness(1.05);
    }
    .fh-map-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(to top, rgba(255,255,255,1), rgba(255,255,255,0));
      z-index: 1;
    }
    .fh-order-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-sm);
      border: 1px solid rgba(0,0,0,0.04);
      transition: all var(--transition-base);
    }
    .fh-order-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-3px);
    }
    .fh-timeline-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      margin: 2rem 0;
      padding: 0 1rem;
      z-index: 2;
    }
    .fh-timeline-bg {
      position: absolute;
      top: 50%; left: 30px; right: 30px;
      height: 4px;
      background: var(--gray-200);
      transform: translateY(-50%);
      z-index: 1;
      border-radius: 2px;
    }
    .fh-timeline-fill {
      position: absolute;
      top: 50%; left: 30px;
      height: 4px;
      background: var(--primary);
      transform: translateY(-50%);
      z-index: 2;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 2px;
    }
    .fh-timeline-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      z-index: 3;
      width: 80px;
    }
    .fh-timeline-icon {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: white;
      border: 4px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--gray-400);
      font-size: 1.2rem;
      transition: all 0.4s ease;
    }
    .fh-timeline-step.completed .fh-timeline-icon {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }
    .fh-timeline-step.active .fh-timeline-icon {
      background: var(--primary);
      border-color: rgba(255, 107, 53, 0.2);
      color: white;
      box-shadow: 0 0 0 6px rgba(255, 107, 53, 0.2);
    }
    .fh-timeline-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--gray-500);
      text-align: center;
    }
    .fh-timeline-step.completed .fh-timeline-label { color: var(--primary); }
    .fh-timeline-step.active .fh-timeline-label { color: var(--dark); }
  </style>
  <script>window.addEventListener('DOMContentLoaded',()=>document.body.style.opacity='1');</script>
</head>

<body>
  <!-- Navbar -->
  <div class="container-fluid m-0 p-0 position-sticky top-0" style="z-index:100;">
    <nav id="mainNavbar" class="navbar navbar-expand-md fh-navbar" role="navigation">
      <div class="container">
        <a id="navLogo" href="./index.html" class="navbar-brand"><span>Food</span>Hub</a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul id="navLinks" class="navbar-nav mx-auto gap-1">
            <li class="nav-item"><a href="./index.html" class="nav-link">Home</a></li>
            <li class="nav-item"><a href="./menu.html" class="nav-link">Restaurants</a></li>
            <li class="nav-item"><a href="./orders.html" class="nav-link active">Orders</a></li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <a href="./cart.html" class="fh-nav-icon" id="navCart" aria-label="Cart">
              <i class="bi bi-bag"></i>
              <span class="fh-nav-badge" id="navCartBadge" style="display:none;"></span>
            </a>
            <a href="./profile.html" class="fh-avatar-sm" id="navAvatar" aria-label="Profile" style="display:none;">
              <i class="bi bi-person" id="navAvatarIcon"></i>
            </a>
            <a href="./login.html" class="btn" id="navLoginBtn" style="display:none; background:var(--primary); color:white; border-radius:var(--radius-full); padding:0.4rem 1.2rem; font-weight:600; font-size:var(--fs-sm); box-shadow:0 4px 10px rgba(255,107,53,0.3);">Login</a>
            <button class="btn btn-sm text-danger" id="navLogoutBtn" style="display:none; font-size: 1.25rem; padding: 0.2rem 0.5rem;" title="Logout">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
        </div>
      </div>
    </nav>
  </div>

  <div class="fh-order-header">
    <div class="container">
      <h2 class="fw-bold mb-1"><i class="bi bi-clock-history" style="color:var(--primary);"></i> My Orders</h2>
      <p id="ordersSubtitle" class="mb-0" style="color:rgba(255,255,255,0.8);">Loading...</p>
    </div>
  </div>

  <div class="container mb-5">
    <!-- Active Order Tracking -->
    <div id="activeOrderSection" style="display:none;" class="mb-5">
      <h5 class="fw-bold mb-3 d-flex align-items-center gap-2">
        <span class="spinner-grow spinner-grow-sm text-primary" role="status"></span> Live Tracking
      </h5>
      <div class="fh-order-card p-0 overflow-hidden">
        <div class="fh-live-map-container m-0 border-radius-0">
          <img src="./src/assets/map_placeholder.png" alt="Map View" />
          <div class="fh-map-overlay"></div>
        </div>
        
        <div class="p-4 pt-2">
          <div class="d-flex justify-content-between align-items-end mb-2">
            <div>
              <p class="mb-0" style="font-size:var(--fs-sm);color:var(--gray-600);">Order <strong id="activeOrderId"></strong></p>
            </div>
            <span class="fh-status-badge shadow-sm" id="activeOrderStatus"></span>
          </div>

          <!-- Tracking Steps -->
          <div id="trackingStepsContainer" class="position-relative">
            <!-- Will be injected by TS -->
          </div>

          <hr class="my-4" />

          <!-- Delivery Info -->
          <div class="row g-3">
            <div class="col-md-6 d-flex align-items-center gap-3">
              <div class="fh-avatar-sm" style="width:48px;height:48px;font-size:1.5rem;"><i class="bi bi-clock-history"></i></div>
              <div>
                <small class="fw-bold text-uppercase" style="color:var(--gray-600);font-size:0.7rem;">Estimated Delivery</small>
                <p class="fw-bold mb-0" id="etaCountdown" style="color:var(--dark);font-size:var(--fs-xl);">Calculating...</p>
              </div>
            </div>
            <div class="col-md-6 d-flex align-items-center gap-3 border-start">
              <div class="fh-avatar-sm" style="width:48px;height:48px;background:var(--gray-200);color:var(--dark);"><i class="bi bi-person-fill"></i></div>
              <div>
                <small class="fw-bold text-uppercase" style="color:var(--gray-600);font-size:0.7rem;">Delivery Partner</small>
                <p class="fw-bold mb-0" id="deliveryPerson" style="font-size:var(--fs-base);"></p>
                <small id="deliveryPhone" style="color:var(--gray-600);font-weight:500;"></small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Order History -->
    <div id="orderHistory"></div>

    <!-- Empty State -->
    <div id="noOrders" style="display:none;">
      <div class="fh-empty-state">
        <i class="bi bi-receipt d-block" style="background: linear-gradient(135deg, var(--gray-300), var(--gray-400)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
        <h4>No orders yet</h4>
        <p>Looks like you haven't made your first order.</p>
        <a href="./menu.html" class="fh-btn-primary mt-3">
          <i class="bi bi-search"></i> Browse Restaurants
        </a>
      </div>
    </div>
  </div>

  <footer class="fh-footer">
    <div class="container">
      <div class="fh-footer-bottom text-center">
        <p class="mb-0">&copy; 2026 FoodHub. Made with ❤️</p>
      </div>
    </div>
  </footer>

  <script type="module" src="./src/services/orders.ts"></script>
</body>

</html>
