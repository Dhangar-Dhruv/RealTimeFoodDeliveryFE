<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to FoodHub to order and track your deliveries." />
  <title>Welcome &mdash; FoodHub</title>
  
  <style>
    :root {
      --primary: #FF6B35;
      --primary-light: #ff8b5e;
      --bg-color: #fff9f6;
      --card-bg: rgba(255, 255, 255, 0.95);
    }
    body { 
      opacity: 0; 
      transition: opacity 0.3s ease-in; 
      margin: 0; 
      overflow-x: hidden; 
      font-family: 'Inter', sans-serif; 
      background-color: var(--bg-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* Abstract background shapes */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      z-index: -1;
      animation: float 10s infinite ease-in-out alternate;
    }
    .shape-1 {
      width: 400px; height: 400px;
      background: rgba(255, 107, 53, 0.2);
      top: -10%; left: -5%;
    }
    .shape-2 {
      width: 500px; height: 500px;
      background: rgba(255, 200, 150, 0.3);
      bottom: -20%; right: -10%;
      animation-delay: -5s;
    }
    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -50px) scale(1.1); }
    }
    
    .fh-auth-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 440px;
      padding: 3rem;
      margin: 2rem;
      z-index: 1;
    }
    
    .fh-auth-brand {
      font-size: 2.2rem;
      font-weight: 800;
      color: #1A1A2E;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      letter-spacing: -0.5px;
    }
    .fh-auth-brand span { color: var(--primary); }
    
    .fh-auth-tabs {
      display: flex;
      gap: 0;
      margin-bottom: 2rem;
      background: rgba(0,0,0,0.03);
      border-radius: 12px;
      padding: 0.4rem;
    }
    .fh-auth-tab {
      flex: 1;
      text-align: center;
      font-weight: 700;
      font-size: 0.95rem;
      color: #868e96;
      cursor: pointer;
      padding: 0.75rem 0;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .fh-auth-tab.active {
      background: white;
      color: #1A1A2E;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    
    .fh-form-control {
      border: 1.5px solid #e9ecef;
      border-radius: 12px;
      padding: 0.85rem 1.2rem;
      font-size: 1rem;
      width: 100%;
      transition: all 0.2s;
      background: white;
    }
    .fh-form-control:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255, 107, 53, 0.1);
    }
    .fh-form-label {
      font-weight: 600;
      font-size: 0.85rem;
      color: #495057;
      margin-bottom: 0.5rem;
      display: block;
    }
    
    .fh-auth-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 1rem;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .fh-auth-btn:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 107, 53, 0.25);
    }
    
    .password-wrapper { position: relative; }
    .password-toggle {
      position: absolute;
      right: 15px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #adb5bd;
      cursor: pointer;
      font-size: 1.2rem;
      padding: 0;
    }
    .password-toggle:hover { color: #495057; }
    
    .invalid-feedback {
      display: none;
      width: 100%;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: #dc3545;
      font-weight: 500;
    }
    .is-invalid { border-color: #dc3545; }
    .is-invalid:focus { box-shadow: 0 0 0 4px rgba(220, 53, 69, 0.1); border-color: #dc3545; }
    .is-invalid ~ .invalid-feedback { display: block; }
    
    .alert { padding: 1rem; margin-bottom: 1.5rem; border-radius: 12px; font-size: 0.9rem; font-weight: 500; }
    .alert-danger { background: #fdf3f4; color: #dc3545; border: 1px solid rgba(220, 53, 69, 0.2); }
    
    @media (max-width: 576px) {
      .fh-auth-card { padding: 2.5rem 1.5rem; margin: 1rem; border-radius: 20px; }
    }
  </style>
  <script>window.addEventListener('DOMContentLoaded',()=>document.body.style.opacity='1');</script>
</head>
<body>

  <!-- Animated Background Shapes -->
  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="fh-auth-card">
    <a href="./index.html" class="fh-auth-brand">
      <span>Food</span>Hub
    </a>
    
    <div class="fh-auth-tabs">
      <div id="tabLogin" class="fh-auth-tab active">Log In</div>
      <div id="tabRegister" class="fh-auth-tab">Register</div>
    </div>

    <form id="authForm" novalidate>
      <div id="alertMsg" class="alert alert-danger" style="display:none;"></div>

      <div class="mb-4" id="nameGroup" style="display:none; margin-bottom: 1.5rem;">
        <label class="fh-form-label">Full Name</label>
        <input type="text" id="inputName" class="fh-form-control" placeholder="John Doe" data-required="true" data-error-required="Please enter your full name." />
        <div class="invalid-feedback">Please enter your full name.</div>
      </div>

      <div class="mb-4" style="margin-bottom: 1.5rem;">
        <label class="fh-form-label">Email Address</label>
        <input type="email" id="inputEmail" class="fh-form-control" placeholder="john@example.com" data-required="true" data-type="email" data-error-required="Please provide an email address." data-error-email="Please enter a valid email address." />
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <div class="mb-4" style="margin-bottom: 1.5rem;">
        <label class="fh-form-label">Password</label>
        <div class="password-wrapper">
          <input type="password" id="inputPassword" class="fh-form-control" placeholder="••••••••" style="padding-right: 2.5rem;" data-required="true" data-minlength="6" data-error-required="Please provide a password." data-error-minlength="Password must be at least 6 characters." />
          <button class="password-toggle" type="button" id="togglePassword">
            <i class="bi bi-eye" id="togglePasswordIcon"></i>
          </button>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
        
        <div style="margin-top: 1.25rem; display: flex; align-items: center; justify-content: space-between;" id="rememberMeGroup">
          <div style="display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="rememberMe" checked style="width: 16px; height: 16px; accent-color: var(--primary);">
            <label for="rememberMe" style="font-size: 0.85rem; color: #6c757d; cursor: pointer; font-weight: 500;">Remember me</label>
          </div>
          <a href="#" style="font-size: 0.85rem; color: var(--primary); text-decoration: none; font-weight: 600;">Forgot Password?</a>
        </div>
      </div>

      <button type="submit" class="fh-auth-btn" id="submitBtn">Sign In</button>
    </form>
    
    <div style="margin-top: 2rem; font-size: 0.8rem; color: #adb5bd; text-align: center;">
      By continuing, you agree to FoodHub's <br/> <a href="#" style="color:#868e96; text-decoration:underline;">Terms of Service</a> & <a href="#" style="color:#868e96; text-decoration:underline;">Privacy Policy</a>.
    </div>
  </div>

  <script type="module" src="./src/services/login.ts"></script>
</body>
</html>
